name: Publish tagged release to Pages
run-name: Publish ${{ github.ref_name }} to Pages

on:
  push:
    tags:
      - 'V*'
      - 'v*'

permissions:
  contents: read

# Do not interrupt a deployment that is already publishing its artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (![`V${pkg.version}`, `v${pkg.version}`].includes(process.env.RELEASE_TAG)
              || lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('Tag, package.json and package-lock.json versions must match.');
          }
          JS
      - run: npm ci
      - run: npm run build
      - name: Check deployable assets
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/simulator/ryzobee.js
          test -s dist/simulator/ryzobee.wasm
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy tagged release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
