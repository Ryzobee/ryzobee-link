<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="RYZOBEE LINK 同源会话 MCP 命令页" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>MCP 命令 · RYZOBEE LINK</title>
  </head>
  <body>
    <main class="agent-page">
      <header class="agent-header">
        <img src="./logo.svg" alt="" />
        <div><h1>RYZOBEE LINK</h1><p>MCP 命令</p></div>
      </header>
      <section class="agent-panel" aria-labelledby="session-heading">
        <h2 id="session-heading">目标会话</h2>
        <div class="agent-row">
          <div class="agent-field">
            <label for="agent-session">LINK 会话</label>
            <select id="agent-session"><option value="">正在发现会话…</option></select>
          </div>
          <button id="discover" type="button">发现会话</button>
          <button id="request-control" type="button" disabled>申请授权</button>
        </div>
        <p id="session-status" class="agent-status" role="status">正在查找同源 LINK 主页面…</p>
      </section>
      <section class="agent-panel" aria-labelledby="command-heading">
        <h2 id="command-heading">MCP 请求</h2>
        <form id="command-form">
          <label for="command-json">MCP JSON-RPC</label>
          <textarea id="command-json" rows="9" spellcheck="false" autocapitalize="off" autocomplete="off" aria-describedby="command-hint"></textarea>
          <p id="command-hint" class="agent-hint">填写完整 JSON-RPC 2.0 请求，每次请求使用新 id。首次提交自动完成 MCP 初始化；会话路由写入 params._meta。通知省略 id。</p>
          <div class="agent-actions">
            <button id="submit-command" class="primary" type="submit" disabled>发送 MCP 请求</button>
            <button id="query-result" type="button" disabled>查询结果</button>
          </div>
        </form>
      </section>
      <section class="agent-panel" aria-labelledby="result-heading">
        <h2 id="result-heading">MCP 响应</h2>
        <pre id="command-result" aria-label="MCP 响应 JSON" tabindex="0">{}</pre>
        <p id="result-status" class="agent-status" role="status">等待发送 MCP 请求</p>
        <p id="result-target" class="agent-hint"></p>
      </section>
    </main>
    <script type="module" src="/src/agent/main.ts"></script>
  </body>
</html>
